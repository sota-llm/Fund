<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fund</title>
  <style>
    :root{
      --ink:#16221f;--muted:#68746f;--line:#dce5e1;--paper:#fbfdfc;
      --green:#087b58;--red:#c83b36;--blue:#347b9b;--gold:#b7893d;
      --soft:#eff5f2;--shadow:0 12px 34px rgba(25,45,38,.07)
    }
    *{box-sizing:border-box} body{margin:0;color:var(--ink);background:#f3f7f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    button,input{font:inherit}.shell{max-width:1500px;margin:auto;padding:26px}
    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
    .eyebrow{font-size:12px;letter-spacing:.13em;color:var(--green);font-weight:800;text-transform:uppercase}
    h1{font-size:33px;line-height:1.15;margin:8px 0 7px;letter-spacing:-.035em}h2{font-size:19px;margin:0}h3{margin:0;font-size:16px}
    .sub{color:var(--muted);font-size:14px;line-height:1.65}.status{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .pill{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.78);color:var(--muted);font-size:12px;white-space:nowrap}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.panel{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
    .hero-grid{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:12px;margin-bottom:14px}.metric{padding:20px;min-height:125px}
    .metric-k{color:var(--muted);font-size:12px}.metric-v{font-size:30px;font-weight:780;letter-spacing:-.04em;margin:10px 0 5px}.metric-s{font-size:12px;color:var(--muted);line-height:1.45}
    .metric.primary{background:linear-gradient(135deg,#14372e,#1d5546);color:#fff;border-color:#214d41}.metric.primary .metric-k,.metric.primary .metric-s{color:#c8dad3}
    .up{color:var(--red)!important}.down{color:var(--green)!important}.flat{color:var(--muted)!important}
    .theme-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.theme-tile{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.18s}
    .theme-tile:hover{transform:translateY(-2px);border-color:#9db6ac}.theme-name{font-weight:750}.theme-stat{font-size:12px;color:var(--muted);margin-top:4px;display:block}.theme-value{font-size:19px;font-weight:800}
    .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;margin-bottom:12px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;color:var(--muted);cursor:pointer}.filter.active{background:var(--ink);border-color:var(--ink);color:#fff}.search{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;min-width:250px;outline:none}.search:focus{border-color:#8ba99d}
    .fund-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fund-card{padding:18px 19px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}.fund-card:hover{transform:translateY(-2px);border-color:#9db6ac;box-shadow:0 16px 38px rgba(25,45,38,.11)}
    .card-top{display:flex;justify-content:space-between;gap:16px}.fund-name{font-weight:780;font-size:17px}.fund-code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-top:5px}.estimate{text-align:right}.estimate b{display:block;font-size:26px;line-height:1}.estimate span{font-size:11px;color:var(--muted)}
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0}.tag{font-size:11px;padding:4px 7px;border-radius:6px;background:var(--soft);color:#376256;font-weight:700}.focus{font-size:13px;color:var(--muted);min-height:20px}.card-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:14px;margin-top:14px;border-top:1px solid #edf1ef}.mini-k{font-size:10px;color:var(--muted)}.mini-v{font-size:13px;font-weight:700;margin-top:3px}.arrow{position:absolute;right:17px;bottom:17px;color:#94a39d}
    .pipeline{margin-top:16px;padding:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.pipe-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.pipe-item{padding:13px;background:var(--soft);border-radius:12px}.pipe-item b{font-size:20px;display:block}.pipe-item span{font-size:11px;color:var(--muted)}.note{margin-top:13px;color:var(--muted);font-size:12px;line-height:1.65}
    .back{border:0;background:none;color:var(--green);padding:3px 0 12px;cursor:pointer;font-weight:700}.detail-hero{padding:22px;margin-bottom:13px}.detail-title{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.detail-name{font-size:26px;font-weight:800;letter-spacing:-.025em}.detail-est{text-align:right}.detail-est strong{font-size:38px}.detail-est small{display:block;color:var(--muted)}
    .detail-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:20px}.dmetric{padding:12px;background:var(--soft);border-radius:12px}.dmetric span{font-size:10px;color:var(--muted);display:block}.dmetric b{font-size:15px;margin-top:4px;display:block}.dmetric small{font-size:10px;color:var(--muted)}
    .chart-panel{padding:20px;margin-bottom:13px}.chart-wrap{position:relative;width:100%;height:310px}.chart-wrap.small{height:270px}canvas{width:100%;height:100%;display:block;outline:none}.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:18px;height:3px;margin-right:6px;vertical-align:middle;border-radius:2px}.legend .dash{height:0;border-top:2px dashed var(--red)}
    .tooltip{position:absolute;z-index:3;pointer-events:none;min-width:170px;padding:10px 11px;border-radius:10px;background:rgba(20,34,30,.94);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:12px}.tooltip[hidden]{display:none}.tip-date{font-weight:800;margin-bottom:6px}.tip-row{display:flex;justify-content:space-between;gap:16px;line-height:1.7}.swatch{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
    .detail-grid{display:grid;grid-template-columns:1.45fr .8fr;gap:13px}.detail-grid>*{min-width:0}.table-panel,.info-panel{padding:20px}.table-wrap{overflow:auto;max-width:100%}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:11px;font-weight:650;padding:9px 8px;border-bottom:1px solid var(--line)}td{padding:11px 8px;border-bottom:1px solid #edf1ef;white-space:nowrap}.rank{color:#9aa7a2}.stock{font-weight:700}.stock-code{color:var(--muted);font-size:10px}.formula{padding:11px;background:var(--soft);border-radius:10px;margin:10px 0;font-size:12px;line-height:1.6}.quality{padding:10px 0;border-bottom:1px solid #edf1ef;font-size:12px;line-height:1.6}.quality:last-child{border-bottom:0}.source-list a{display:block;color:var(--green);text-decoration:none;font-size:12px;line-height:1.9}.source-list a:hover{text-decoration:underline}
    .empty,.loading{padding:80px 20px;text-align:center;color:var(--muted)}.spinner{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 13px}@keyframes spin{to{transform:rotate(360deg)}}
    .footer{padding:18px 4px 5px;color:var(--muted);font-size:11px;line-height:1.7}
    @media(max-width:900px){.shell{padding:15px}.topbar{display:block}.status{justify-content:flex-start;margin-top:12px}.hero-grid{grid-template-columns:1fr 1fr}.hero-grid .primary{grid-column:1/-1}.theme-row{grid-template-columns:1fr 1fr}.fund-grid{grid-template-columns:1fr}.pipe-grid{grid-template-columns:1fr 1fr}.detail-metrics{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr}.search{min-width:0;width:100%}.toolbar{align-items:stretch;flex-direction:column}.detail-title{display:block}.detail-est{text-align:left;margin-top:18px}}
  </style>
</head>
<body>
  <main class="shell" id="app"><div class="panel loading"><div class="spinner"></div>等待后台生成数据……</div></main>
  <script>
    if(location.protocol==='file:') location.replace(`http://127.0.0.1:8765/dashboard.html${location.search}${location.hash}`);
    const $=(s,r=document)=>r.querySelector(s), esc=v=>String(v??'--').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pct=(v,d=2)=>Number.isFinite(v)?`${v>=0?'+':''}${v.toFixed(d)}%`:'--';
    const num=(v,d=2)=>Number.isFinite(v)?v.toFixed(d):'--';
    const cls=v=>!Number.isFinite(v)?'flat':v>0?'up':v<0?'down':'flat';
    const fmtTime=v=>v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'--';
    const initialParams=new URLSearchParams(location.search);
    const STATIC_MODE=location.hostname.endsWith('.github.io')||initialParams.get('static')==='1';
    const overviewUrl=()=>STATIC_MODE?`./static-data/overview.json?t=${Date.now()}`:`/api/overview?t=${Date.now()}`;
    const fundUrl=code=>STATIC_MODE?`./static-data/funds/${encodeURIComponent(code)}.json?t=${Date.now()}`:`/api/fund?code=${encodeURIComponent(code)}&t=${Date.now()}`;
    let overview=null, activeTheme='全部', searchText='', activeCode=initialParams.get('fund');
    let chartHandlers=[];

    function layoutHeader(mode='overview'){
      return `<div class="topbar"><div><div class="eyebrow">Fund</div><h1>${mode==='overview'?'硬科技基金雷达':'基金盘中详情'}</h1><div class="sub">${mode==='overview'?'基于最新披露持仓的统一口径估算 · CPO / 半导体 / PCB / MLCC':'正式净值、盘中估算与披露组合分开展示'}</div></div><div class="status"><span class="pill"><i class="dot"></i>${STATIC_MODE?'静态快照':esc(overview?.market_status||'加载中')}</span><span class="pill">行情 ${fmtTime(overview?.as_of)}</span><span class="pill">${STATIC_MODE?`快照 ${fmtTime(overview?.publication?.exported_at)}`:'页面每10秒读取'}</span></div></div>`;
    }
    function renderOverview(){
      activeCode=null;history.replaceState({},'',location.pathname);chartHandlers.forEach(fn=>fn());chartHandlers=[];
      const s=overview.summary,p=overview.pipeline;
      const themes=s.theme_summary.map(t=>`<button class="panel theme-tile" data-theme="${esc(t.theme)}"><span><span class="theme-name">${esc(t.theme)}</span><span class="theme-stat">${t.fund_count}只观察基金 · 等权均值</span></span><span class="theme-value ${cls(t.average_estimate_pct)}">${pct(t.average_estimate_pct)}</span></button>`).join('');
      $('#app').innerHTML=`${layoutHeader()}<section class="hero-grid"><div class="panel metric primary"><div class="metric-k">观察池等权平均估算</div><div class="metric-v">${pct(s.average_estimate_pct)}</div><div class="metric-s">仅用于快速观察共同方向，不是可交易指数，也不代表组合收益</div></div><div class="panel metric"><div class="metric-k">上涨 / 下跌</div><div class="metric-v"><span class="up">${s.up_count}</span> / <span class="down">${s.down_count}</span></div><div class="metric-s">共 ${s.fund_count} 只 · 同一估值时点</div></div><div class="panel metric"><div class="metric-k">共享行情池</div><div class="metric-v">${p.unique_stocks}</div><div class="metric-s">由 ${p.raw_holding_rows} 条披露持仓去重而来</div></div><div class="panel metric"><div class="metric-k">单轮实时请求</div><div class="metric-v">${p.quote_batch_requests}</div><div class="metric-s">主源一次 + 交叉核验一次 · ${num(p.cycle_seconds,2)}秒</div></div></section><section class="theme-row">${themes}</section><section class="panel toolbar"><div class="filters">${['全部','CPO','半导体','PCB','MLCC'].map(t=>`<button class="filter ${activeTheme===t?'active':''}" data-filter="${t}">${t}</button>`).join('')}</div><input class="search" value="${esc(searchText)}" placeholder="搜索基金名称或代码"></section><section class="fund-grid" id="fund-grid"></section><section class="panel pipeline"><div class="panel-head"><h2>刷新流程与负载</h2><span class="pill">${STATIC_MODE?'本页为一次性静态快照':'可稳定扩展到当前10只'}</span></div><div class="pipe-grid"><div class="pipe-item"><b>${p.raw_holding_rows}</b><span>原始持仓行</span></div><div class="pipe-item"><b>${p.unique_stocks}</b><span>去重股票</span></div><div class="pipe-item"><b>${p.dedup_saved_rows}</b><span>本轮省去重复查询</span></div><div class="pipe-item"><b>${STATIC_MODE?'手动':`${p.refresh_seconds}s`}</b><span>${STATIC_MODE?'静态快照更新':'实时行情刷新'}</span></div><div class="pipe-item"><b>6h</b><span>持仓/净值资料刷新</span></div></div><div class="note">${esc(p.detail_mode)}。${STATIC_MODE?`本快照导出于 ${fmtTime(overview.publication?.exported_at)}`:`因此后台常态刷新不会同时抓取10套分钟线；点进具体基金时才生成详情。生成于 ${fmtTime(overview.generated_at)}`}。</div></section><footer class="footer">${esc(overview.universe_note)} ${esc(overview.quality.disclaimer)}</footer>`;
      bindOverview();paintCards();
    }
    function paintCards(){
      const needle=searchText.trim().toLowerCase();
      const rows=overview.funds.filter(f=>(activeTheme==='全部'||f.themes.includes(activeTheme))&&(!needle||f.name.toLowerCase().includes(needle)||f.code.includes(needle)));
      $('#fund-grid').innerHTML=rows.length?rows.map(f=>`<article class="panel fund-card" tabindex="0" data-code="${f.code}"><div class="card-top"><div><div class="fund-name">${esc(f.name)}</div><div class="fund-code">${f.code} · ${esc(f.posture)}</div></div><div class="estimate"><b class="${cls(f.estimate_pct)}">${pct(f.estimate_pct)}</b><span>今日模型涨幅</span></div></div><div class="tags">${f.themes.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="focus">${esc(f.focus)}</div><div class="card-foot"><div><div class="mini-k">前十披露占比</div><div class="mini-v">${num(f.top10_weight_pct)}%</div></div><div><div class="mini-k">股票仓位</div><div class="mini-v">${num(f.stock_allocation_pct)}%</div></div><div><div class="mini-k">T日预估净值</div><div class="mini-v">${num(f.estimated_nav,4)}</div></div></div><span class="arrow">→</span></article>`).join(''):`<div class="panel empty">没有匹配的基金</div>`;
      document.querySelectorAll('.fund-card').forEach(card=>{const open=()=>openDetail(card.dataset.code);card.onclick=open;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}});
    }
    function bindOverview(){
      document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeTheme=b.dataset.filter;renderOverview()});
      document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{activeTheme=b.dataset.theme;renderOverview()});
      $('.search').oninput=e=>{searchText=e.target.value;paintCards()};
    }
    async function openDetail(code,push=true){
      activeCode=code;if(push)history.pushState({code},'',`?fund=${code}`);
      $('#app').innerHTML=`${layoutHeader('detail')}<div class="panel loading"><div class="spinner"></div>${STATIC_MODE?`正在读取 ${esc(code)} 的静态详情……`:`正在按需生成 ${esc(code)} 的分钟线和30日披露组合……<br><small>第一次打开通常需要数秒，随后读取缓存</small>`}</div>`;
      try{const r=await fetch(fundUrl(code),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);if(activeCode===code)renderDetail(d)}catch(e){$('#app').innerHTML=`${layoutHeader('detail')}<div class="panel empty">详情加载失败：${esc(e.message||e)}<br><br><button class="filter" onclick="renderOverview()">返回总览</button></div>`}
    }
    function renderDetail(d){
      const f=d.fund,themeWeights=Object.entries(f.theme_disclosed_weights_pct).filter(([,v])=>v>0).map(([k,v])=>`${k} ${num(v)}%`).join(' · ')||'前十内未命中主题标记';
      const holdings=f.holdings.map((h,i)=>`<tr><td class="rank">${i+1}</td><td><span class="stock">${esc(h.name)}</span><br><span class="stock-code">${h.code}</span></td><td>${num(h.weight_pct)}%</td><td>${num(h.price,2)}</td><td class="${cls(h.return_pct)}">${pct(h.return_pct)}</td><td class="${cls(h.contribution_pct_point)}">${pct(h.contribution_pct_point,3)}</td><td>${h.theme_tags.map(t=>`<span class="tag">${t}</span>`).join('')||'—'}</td></tr>`).join('');
      $('#app').innerHTML=`${layoutHeader('detail')}<button class="back" id="back">← 返回10只基金总览</button><section class="panel detail-hero"><div class="detail-title"><div><div class="detail-name">${esc(f.name)}</div><div class="fund-code">${f.code} · 持仓截至 ${f.holding_report_date} · ${f.holding_disclosure_age_days}天前</div><div class="tags">${f.themes.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="sub">${esc(f.focus)}</div></div><div class="detail-est"><strong class="${cls(f.estimate_pct)}">${pct(f.estimate_pct)}</strong><small>今日模型涨幅 · ${esc(f.posture)}</small></div></div><div class="detail-metrics"><div class="dmetric"><span>T−1正式净值</span><b>${num(f.previous_nav.unit_nav,4)} <small>${f.previous_nav.date}</small></b></div><div class="dmetric"><span>T日预估净值</span><b>${num(f.estimated_nav,4)}</b></div><div class="dmetric"><span>前十合计权重</span><b>${num(f.top10_weight_pct)}%</b></div><div class="dmetric"><span>披露股票仓位</span><b>${num(f.stock_allocation_pct)}%</b></div><div class="dmetric"><span>行情交叉核验最大差异</span><b>${pct(f.max_crosscheck_difference_pct_point)}</b></div></div></section><section class="panel chart-panel"><div class="panel-head"><div><h2>盘中模型轨迹 · ${esc(d.intraday.trade_date||'--')}</h2><div class="sub">午休压缩为连续坐标，并用虚线标记；图内可移动和点击查看分钟值</div></div><div class="legend"><span><i style="background:var(--red)"></i>基金模型涨幅</span></div></div><div class="chart-wrap small"><canvas id="intraday" tabindex="0"></canvas><div id="tip1" class="tooltip" hidden></div></div></section><section class="panel chart-panel"><div class="panel-head"><div><h2>最近30个交易点</h2><div class="sub">正式基金净值是真实值；当日估算只从T−1正式净值虚线延伸一次</div></div><div class="legend"><span><i style="background:var(--red)"></i>正式基金净值</span><span><i style="background:var(--gold)"></i>披露前十组合</span><span><i style="background:#74817c"></i>沪深300</span><span><i class="dash"></i>T日估算延伸</span></div></div><div class="chart-wrap"><canvas id="comparison" tabindex="0"></canvas><div id="tip2" class="tooltip" hidden></div></div></section><section class="detail-grid"><div class="panel table-panel"><div class="panel-head"><div><h2>最新披露前十大持仓</h2><div class="sub">主题暴露只统计披露前十：${esc(themeWeights)}</div></div><span class="pill">${f.quote_count}/${f.holding_count}只行情</span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>股票</th><th>占净值</th><th>现价</th><th>今日涨跌</th><th>净值贡献</th><th>主题标记</th></tr></thead><tbody>${holdings}</tbody></table></div></div><aside class="panel info-panel"><h2>模型与数据质量</h2><div class="formula"><b>${esc(d.model.name)}</b><br>${esc(d.model.formula)}</div><div class="formula">${esc(d.model.nav_formula)}<br>${esc(d.model.note)}</div><div class="quality"><b>不是实际盘中净值</b><br>基金可能已换仓，且前十以外资产、现金、港股、债券、费用与申赎冲击均无法实时还原。</div><div class="quality"><b>${STATIC_MODE?'静态详情生成耗时':'按需详情耗时'}</b><br>${num(d.detail_build_seconds,2)}秒；${STATIC_MODE?`快照导出于 ${fmtTime(d.publication?.exported_at)}`:'休市后缓存6小时，交易中缓存55秒'}。</div><div class="quality source-list"><b>数据来源</b>${d.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.name)} · ${esc(s.use)}</a>`).join('')}<a href="${esc(f.selection_source)}" target="_blank" rel="noreferrer">观察池入选依据</a></div></aside></section><footer class="footer">${esc(d.quality.disclaimer)} 详情生成于 ${fmtTime(d.generated_at)}。</footer>`;
      $('#back').onclick=()=>{history.pushState({},'',location.pathname);renderOverview()};
      drawIntraday(d.intraday.points||[]);drawComparison(d.comparison_30d.points||[]);
    }
    function canvasBase(id,height){const c=$(id),box=c.parentElement.getBoundingClientRect(),ratio=devicePixelRatio||1,W=box.width,H=height;c.width=W*ratio;c.height=H*ratio;const x=c.getContext('2d');x.scale(ratio,ratio);return{c,x,W,H,pad:{l:50,r:18,t:18,b:34}}}
    function grid(x,W,H,pad,lo,hi,ypos,ticks){x.font='11px sans-serif';x.textAlign='right';x.textBaseline='middle';for(let i=0;i<5;i++){const v=hi-(hi-lo)*i/4,y=ypos(v);x.strokeStyle='#e2e8e5';x.lineWidth=1;x.beginPath();x.moveTo(pad.l,y);x.lineTo(W-pad.r,y);x.stroke();x.fillStyle='#68746f';x.fillText(`${v.toFixed(1)}%`,pad.l-7,y)}x.textAlign='center';x.textBaseline='top';ticks.forEach(([xx,label])=>{x.strokeStyle='#edf1ef';x.beginPath();x.moveTo(xx,pad.t);x.lineTo(xx,H-pad.b);x.stroke();x.fillStyle='#68746f';x.fillText(label,xx,H-pad.b+9)});if(lo<0&&hi>0){x.save();x.setLineDash([4,4]);x.strokeStyle='#aab6b1';x.beginPath();x.moveTo(pad.l,ypos(0));x.lineTo(W-pad.r,ypos(0));x.stroke();x.restore()}}
    function drawIntraday(rows){const {c,x,W,H,pad}=canvasBase('#intraday',270),tip=$('#tip1');const clean=rows.filter(r=>r.time&&Number.isFinite(r.estimate_pct));if(clean.length<2){x.fillStyle='#68746f';x.fillText('分钟线暂不可用',pad.l,120);return}const vals=clean.map(r=>r.estimate_pct);let lo=Math.min(0,...vals),hi=Math.max(0,...vals),extra=Math.max(.2,(hi-lo)*.1);lo-=extra;hi+=extra;const ypos=v=>pad.t+(hi-v)/(hi-lo)*(H-pad.t-pad.b),mm=t=>{let[h,m]=t.split(':').map(Number),v=h*60+m;return v<=690?v-570:121+v-780},xpos=t=>pad.l+mm(t)/241*(W-pad.l-pad.r);const xt=[['09:30','09:30'],['10:30','10:30'],['11:30','11:30 / 13:00'],['14:00','14:00'],['15:00','15:00']].map(([t,l])=>[xpos(t),l]);let pinned=false,selected=null;
      function paint(i=null){x.clearRect(0,0,W,H);grid(x,W,H,pad,lo,hi,ypos,xt);const lunch=xpos('11:30');x.save();x.setLineDash([5,5]);x.strokeStyle='#7f918a';x.beginPath();x.moveTo(lunch,pad.t);x.lineTo(lunch,H-pad.b);x.stroke();x.restore();x.fillStyle='#68746f';x.fillText('午间休市',lunch,pad.t+5);x.strokeStyle='#c83b36';x.lineWidth=2.5;x.lineJoin='round';x.beginPath();clean.forEach((r,j)=>j?x.lineTo(xpos(r.time),ypos(r.estimate_pct)):x.moveTo(xpos(r.time),ypos(r.estimate_pct)));x.stroke();if(i==null){tip.hidden=true;return}const r=clean[i],xx=xpos(r.time);x.save();x.setLineDash([3,3]);x.strokeStyle='#52635d';x.beginPath();x.moveTo(xx,pad.t);x.lineTo(xx,H-pad.b);x.stroke();x.restore();x.fillStyle='#fff';x.strokeStyle='#c83b36';x.lineWidth=2;x.beginPath();x.arc(xx,ypos(r.estimate_pct),4,0,Math.PI*2);x.fill();x.stroke();tip.innerHTML=`<div class="tip-date">${r.time}${pinned?' · 已固定':''}</div><div class="tip-row"><span><i class="swatch" style="background:#c83b36"></i>模型涨幅</span><b>${pct(r.estimate_pct)}</b></div>`;placeTip(tip,xx,ypos(r.estimate_pct),W,H)}
      const idx=e=>{const px=e.clientX-c.getBoundingClientRect().left;let b=0,d=Infinity;clean.forEach((r,i)=>{const n=Math.abs(xpos(r.time)-px);if(n<d){d=n;b=i}});return b};c.onpointermove=e=>{if(!pinned){selected=idx(e);paint(selected)}};c.onpointerleave=()=>{if(!pinned)paint()};c.onclick=e=>{const i=idx(e);if(pinned&&selected===i){pinned=false;selected=null;paint()}else{pinned=true;selected=i;paint(i)}};paint();chartHandlers.push(()=>{c.onpointermove=c.onclick=c.onpointerleave=null})}
    function drawComparison(rows){const {c,x,W,H,pad}=canvasBase('#comparison',310),tip=$('#tip2');const clean=rows.filter(r=>r.date);if(clean.length<2){x.fillStyle='#68746f';x.fillText('30日数据暂不可用',pad.l,140);return}const series=[['formal_fund_pct','正式基金','#c83b36'],['top10_pct','披露前十','#b7893d'],['market_pct','沪深300','#74817c']];const vals=clean.flatMap(r=>[...series.map(s=>r[s[0]]),r.estimated_fund_pct]).filter(Number.isFinite);let lo=Math.min(0,...vals),hi=Math.max(0,...vals),extra=Math.max(.4,(hi-lo)*.1);lo-=extra;hi+=extra;const ypos=v=>pad.t+(hi-v)/(hi-lo)*(H-pad.t-pad.b),xpos=i=>pad.l+i/(clean.length-1)*(W-pad.l-pad.r);const ids=[0,Math.round((clean.length-1)/4),Math.round((clean.length-1)/2),Math.round((clean.length-1)*3/4),clean.length-1].filter((v,i,a)=>a.indexOf(v)===i),xt=ids.map(i=>[xpos(i),clean[i].date.slice(5).replace('-','/')]);let pinned=false,selected=null;
      function paint(i=null){x.clearRect(0,0,W,H);grid(x,W,H,pad,lo,hi,ypos,xt);for(const [key,,color] of series){x.strokeStyle=color;x.lineWidth=key==='formal_fund_pct'?2.6:2;x.beginPath();let active=false;clean.forEach((r,j)=>{if(!Number.isFinite(r[key])){active=false;return}active?x.lineTo(xpos(j),ypos(r[key])):x.moveTo(xpos(j),ypos(r[key]));active=true});x.stroke()}const ei=clean.findIndex(r=>Number.isFinite(r.estimated_fund_pct)),fi=clean.reduce((a,r,j)=>Number.isFinite(r.formal_fund_pct)?j:a,-1);if(ei>=0&&fi>=0){x.save();x.setLineDash([6,4]);x.strokeStyle='#c83b36';x.lineWidth=2.6;x.beginPath();x.moveTo(xpos(fi),ypos(clean[fi].formal_fund_pct));x.lineTo(xpos(ei),ypos(clean[ei].estimated_fund_pct));x.stroke();x.restore()}if(i==null){tip.hidden=true;return}const r=clean[i],xx=xpos(i);x.save();x.setLineDash([3,3]);x.strokeStyle='#52635d';x.beginPath();x.moveTo(xx,pad.t);x.lineTo(xx,H-pad.b);x.stroke();x.restore();const rowsHtml=series.map(([key,label,color])=>`<div class="tip-row"><span><i class="swatch" style="background:${color}"></i>${label}</span><b>${pct(r[key])}</b></div>`).join('')+(Number.isFinite(r.estimated_fund_pct)?`<div class="tip-row"><span><i class="swatch" style="background:#c83b36"></i>T日估算</span><b>${pct(r.estimated_fund_pct)} / ${num(r.estimated_unit_nav,4)}</b></div>`:'');tip.innerHTML=`<div class="tip-date">${r.date}${pinned?' · 已固定':''}</div>${rowsHtml}`;const plotted=[...series.map(s=>r[s[0]]),r.estimated_fund_pct].filter(Number.isFinite);placeTip(tip,xx,Math.min(...plotted.map(ypos)),W,H)}
      const idx=e=>Math.max(0,Math.min(clean.length-1,Math.round((e.clientX-c.getBoundingClientRect().left-pad.l)/(W-pad.l-pad.r)*(clean.length-1))));c.onpointermove=e=>{if(!pinned){selected=idx(e);paint(selected)}};c.onpointerleave=()=>{if(!pinned)paint()};c.onclick=e=>{const i=idx(e);if(pinned&&selected===i){pinned=false;selected=null;paint()}else{pinned=true;selected=i;paint(i)}};paint();chartHandlers.push(()=>{c.onpointermove=c.onclick=c.onpointerleave=null})}
    function placeTip(tip,x,y,W,H){tip.hidden=false;const tw=tip.offsetWidth,th=tip.offsetHeight;let l=x+12;if(l+tw>W-5)l=x-tw-12;tip.style.left=`${Math.max(5,l)}px`;tip.style.top=`${Math.max(5,Math.min(H-th-5,y-th-10))}px`}
    async function loadOverview(first=false){try{const r=await fetch(overviewUrl(),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);overview=d;if(first){activeCode?openDetail(activeCode,false):renderOverview()}else if(!activeCode)renderOverview()}catch(e){if(first)$('#app').innerHTML=`<div class="panel empty">${STATIC_MODE?'静态快照加载失败':'等待后台生成数据……'}<br><small>${esc(e.message||e)}</small>${STATIC_MODE?'':'<br><br>请确认已运行：python3 multi_monitor.py serve'}</div>`}}
    addEventListener('popstate',()=>{const code=new URLSearchParams(location.search).get('fund');code?openDetail(code,false):renderOverview()});
    addEventListener('resize',()=>{if(activeCode)openDetail(activeCode,false)});
    loadOverview(true);setInterval(()=>loadOverview(false),STATIC_MODE?60000:10000);
  </script>
